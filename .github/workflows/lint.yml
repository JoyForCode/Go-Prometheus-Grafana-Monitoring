name: Go-Lint

on:
    push:
        branches:
           - develop
           - main
    pull_request:
        branches:
              - develop
              - main

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.25'
            
            - name: Check formatting (gofmt)
              run: |
                if [ -n "$(gofmt -l .)" ]; then
                  echo "The following files are not properly formatted:"
                  gofmt -l .
                  exit 1
                fi
            
            - name: Run go vet
              run: go vet ./...

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v6
              with:
                version: latest